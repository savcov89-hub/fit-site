name: write-article

on:
  schedule:
    # 09:23 по Новосибирску. Не ровно в начале часа: в :00 GitHub перегружен
    # и откладывает запуски по расписанию на часы (23.10 старт был в 15:13).
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Запрос для статьи (пусто — следующий из agent/topics.csv)"
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: write-article
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Если статью за сегодня уже запустили вручную, запуск по расписанию её не дублирует.
      - name: Проверить, есть ли статья за сегодня
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && grep -lq "\"date\": \"$(date -u +%F)\"" content/articles/*.md; then
            echo "Статья за $(date -u +%F) уже есть, пропускаю."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
        if: steps.guard.outputs.skip != 'true'

      - name: Написать статью
        if: steps.guard.outputs.skip != 'true'
        id: art
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          MODEL: ${{ vars.MODEL || 'claude-opus-5-5' }}
          RESEARCH_MODEL: ${{ vars.RESEARCH_MODEL || 'claude-haiku-5-5' }}
          REPORT_FILE: ${{ runner.temp }}/pr_body.md
          MONTH_LIMIT_USD: ${{ vars.MONTH_LIMIT_USD || '25' }}
          TOPIC: ${{ inputs.topic }}
        run: |
          if [ -n "$TOPIC" ]; then
            python3 agent/write_article.py --topic "$TOPIC"
          else
            python3 agent/write_article.py
          fi

      - name: Проверить, что сайт собирается
        if: steps.guard.outputs.skip != 'true'
        run: python3 build.py

      - name: Отправить на проверку или опубликовать
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH }}
          SLUG: ${{ steps.art.outputs.slug }}
          TITLE: ${{ steps.art.outputs.title }}
          REPORT_FILE: ${{ runner.temp }}/pr_body.md
        run: |
          git config user.name "seo-agent"
          git config user.email "seo-agent@users.noreply.github.com"
          if [ "$AUTO_PUBLISH" = "true" ]; then
            git add content/articles static/img agent/topics.csv agent/usage.csv
            git commit -m "Статья: $TITLE"
            # Пока писалась статья, в main могли слить другие изменения.
            git pull --rebase origin main
            git push origin HEAD:main
          else
            BR="article/$SLUG"
            git checkout -b "$BR"
            git add content/articles static/img agent/topics.csv agent/usage.csv
            git commit -m "Статья: $TITLE"
            git push -u origin "$BR"
            gh pr create --base main --head "$BR" --title "Статья: $TITLE" --body-file "$REPORT_FILE"
          fi
