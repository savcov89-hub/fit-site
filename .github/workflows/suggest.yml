name: collect-suggest
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-7hkhsd]
    paths: [agent/semantic/seeds.txt, agent/semantic/collect.py]
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 agent/semantic/collect.py
      - name: Commit result
        run: |
          git config user.name "suggest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add agent/semantic/suggest_raw.csv
          git commit -m "Подсказки Яндекса и Google для семантического ядра" || exit 0
          git push
