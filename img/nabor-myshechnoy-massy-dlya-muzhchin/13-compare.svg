<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 298" role="img" aria-label="Шесть упражнений программы"><title>Шесть упражнений программы</title>
<style>
.bone{fill:#efe9dc;stroke:#7d776b;stroke-width:2;stroke-linejoin:round}
.joint{fill:#efe9dc;stroke:#7d776b;stroke-width:2}
.vert{fill:#e2dccd;stroke:#7d776b;stroke-width:1.2}
.m{fill:#c7867a;fill-opacity:.42;stroke:#a9665a;stroke-opacity:.55;stroke-width:1}
.on{fill:#d2491d;fill-opacity:.82;stroke:#9c3412;stroke-opacity:.9}
.plate{fill:#3a3a37;fill-opacity:.1;stroke:#3a3a37;stroke-width:3}
.bar{fill:#3a3a37}
.ghost{opacity:.18}
.ground{stroke:#b9b5aa;stroke-width:3}
.guide{stroke:#3d7fb8;stroke-width:2.5;stroke-dasharray:8 7;fill:none}
.arrow{stroke:#d2491d;stroke-width:5;fill:none;stroke-linecap:round;marker-end:url(#ah)}
.ahead{fill:#d2491d}
.lead{stroke:#6b6b66;stroke-width:1.5;fill:none}
.t{font:600 21px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#1d1d1b}
.s{font:400 18px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#55554f}
.ok{fill:#2e8b57}.bad{fill:#c0392b}
.balloon{fill:#3d7fb8;fill-opacity:.25;stroke:#3d7fb8;stroke-width:2}
@media (prefers-color-scheme:dark){
.bone,.joint{fill:#d9d3c4;stroke:#3b3934}.vert{fill:#c9c2b2;stroke:#3b3934}
.plate{fill:#ecebe6;fill-opacity:.12;stroke:#bdbbb3}.bar{fill:#bdbbb3}
.t{fill:#ecebe6}.s{fill:#a9a8a1}.lead{stroke:#9a9993}.ground{stroke:#55534d}
.arrow{stroke:#f0703f}.ahead{fill:#f0703f}.on{fill:#f0703f}
}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto">
<path class="ahead" d="M0 0L10 5L0 10z"/></marker></defs>
<style>
.small{font-size:15px}
.barfill{fill:#d2491d}.track{stroke:#d9d5ca;stroke-width:3}
.card{fill:#f3f1ea;stroke:#e2ded2}.dot{fill:#d2491d}
.okc{fill:#2e8b57}.badc{fill:#c0392b}.mark{stroke:#fff;stroke-width:3.5;fill:none;stroke-linecap:round}
.num{fill:#d2491d}.numt{font:700 18px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#fff}
@media (prefers-color-scheme:dark){.barfill,.dot,.num{fill:#f0703f}.track{stroke:#3a3934}.card{fill:#26262a;stroke:#34343a}}
</style><text class="t" x="32" y="44" text-anchor="start">Шесть упражнений программы</text><rect class="card" x="32" y="78" width="181" height="196" rx="12"/><text style="font-size:21px" class="t" x="48" y="112" text-anchor="start">Ноги</text><circle class="dot" cx="52" cy="138" r="4"/><text class="s" x="64" y="144" text-anchor="start">приседания</text><text class="s" x="64" y="166" text-anchor="start">со штангой</text><circle class="dot" cx="52" cy="190" r="4"/><text class="s" x="64" y="196" text-anchor="start">румынская</text><text class="s" x="64" y="218" text-anchor="start">тяга</text><rect class="card" x="229" y="78" width="181" height="196" rx="12"/><text style="font-size:21px" class="t" x="245" y="112" text-anchor="start">Грудь и</text><text style="font-size:21px" class="t" x="245" y="138" text-anchor="start">плечи</text><circle class="dot" cx="249" cy="164" r="4"/><text class="s" x="261" y="170" text-anchor="start">жим штанги</text><text class="s" x="261" y="192" text-anchor="start">лёжа</text><circle class="dot" cx="249" cy="216" r="4"/><text class="s" x="261" y="222" text-anchor="start">жим гантелей</text><text class="s" x="261" y="244" text-anchor="start">сидя</text><rect class="card" x="427" y="78" width="181" height="196" rx="12"/><text style="font-size:21px" class="t" x="443" y="112" text-anchor="start">Спина</text><circle class="dot" cx="447" cy="138" r="4"/><text class="s" x="459" y="144" text-anchor="start">тяга</text><text class="s" x="459" y="166" text-anchor="start">верхнего</text><text class="s" x="459" y="188" text-anchor="start">блока</text><circle class="dot" cx="447" cy="212" r="4"/><text class="s" x="459" y="218" text-anchor="start">тяга штанги</text><text class="s" x="459" y="240" text-anchor="start">в наклоне</text></svg>
