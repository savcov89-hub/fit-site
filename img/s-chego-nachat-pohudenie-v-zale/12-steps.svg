<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 474" role="img" aria-label="Коротко весь план: питание, нагрузка, упражнения и постепенная прогрессия."><title>Коротко весь план: питание, нагрузка, упражнения и постепенная прогрессия.</title>
<style>
.bone{fill:#efe9dc;stroke:#7d776b;stroke-width:2;stroke-linejoin:round}
.joint{fill:#efe9dc;stroke:#7d776b;stroke-width:2}
.vert{fill:#e2dccd;stroke:#7d776b;stroke-width:1.2}
.m{fill:#c7867a;fill-opacity:.42;stroke:#a9665a;stroke-opacity:.55;stroke-width:1}
.on{fill:#d2491d;fill-opacity:.82;stroke:#9c3412;stroke-opacity:.9}
.plate{fill:#3a3a37;fill-opacity:.1;stroke:#3a3a37;stroke-width:3}
.bar{fill:#3a3a37}
.ghost{opacity:.18}
.ground{stroke:#b9b5aa;stroke-width:3}
.guide{stroke:#3d7fb8;stroke-width:2.5;stroke-dasharray:8 7;fill:none}
.arrow{stroke:#d2491d;stroke-width:5;fill:none;stroke-linecap:round;marker-end:url(#ah)}
.ahead{fill:#d2491d}
.lead{stroke:#6b6b66;stroke-width:1.5;fill:none}
.t{font:600 21px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#1d1d1b}
.s{font:400 18px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#55554f}
.ok{fill:#2e8b57}.bad{fill:#c0392b}
.balloon{fill:#3d7fb8;fill-opacity:.25;stroke:#3d7fb8;stroke-width:2}
@media (prefers-color-scheme:dark){
.bone,.joint{fill:#d9d3c4;stroke:#3b3934}.vert{fill:#c9c2b2;stroke:#3b3934}
.plate{fill:#ecebe6;fill-opacity:.12;stroke:#bdbbb3}.bar{fill:#bdbbb3}
.t{fill:#ecebe6}.s{fill:#a9a8a1}.lead{stroke:#9a9993}.ground{stroke:#55534d}
.arrow{stroke:#f0703f}.ahead{fill:#f0703f}.on{fill:#f0703f}
}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto">
<path class="ahead" d="M0 0L10 5L0 10z"/></marker></defs>
<style>
.small{font-size:15px}
.barfill{fill:#d2491d}.track{stroke:#d9d5ca;stroke-width:3}
.card{fill:#f3f1ea;stroke:#e2ded2}.dot{fill:#d2491d}
.okc{fill:#2e8b57}.badc{fill:#c0392b}.mark{stroke:#fff;stroke-width:3.5;fill:none;stroke-linecap:round}
.num{fill:#d2491d}.numt{font:700 18px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#fff}
@media (prefers-color-scheme:dark){.barfill,.dot,.num{fill:#f0703f}.track{stroke:#3a3934}.card{fill:#26262a;stroke:#34343a}}
</style><text class="t" x="32" y="44" text-anchor="start">С чего начать</text><circle class="num" cx="50" cy="90" r="18"/><text class="numt" x="50" y="97" text-anchor="middle">1</text><text class="t" x="84" y="90" text-anchor="start">Дефицит 500 ккал</text><text class="s" x="84" y="116" text-anchor="start">Главный рычаг, по ACSM 500–1000 ккал</text><line class="track" x1="50" y1="112" x2="50" y2="152"/><circle class="num" cx="50" cy="168" r="18"/><text class="numt" x="50" y="175" text-anchor="middle">2</text><text class="t" x="84" y="168" text-anchor="start">Силовые 2–3 раза в неделю</text><text class="s" x="84" y="194" text-anchor="start">Помогают сохранить мышцы</text><line class="track" x1="50" y1="190" x2="50" y2="230"/><circle class="num" cx="50" cy="246" r="18"/><text class="numt" x="50" y="253" text-anchor="middle">3</text><text class="t" x="84" y="246" text-anchor="start">Около 150 мин кардио</text><text class="s" x="84" y="272" text-anchor="start">Вид выбирай тот, что делаешь регулярно</text><line class="track" x1="50" y1="268" x2="50" y2="308"/><circle class="num" cx="50" cy="324" r="18"/><text class="numt" x="50" y="331" text-anchor="middle">4</text><text class="t" x="84" y="324" text-anchor="start">Базовые упражнения</text><text class="s" x="84" y="350" text-anchor="start">2–3 подхода по 8–12 повторений</text><line class="track" x1="50" y1="346" x2="50" y2="386"/><circle class="num" cx="50" cy="402" r="18"/><text class="numt" x="50" y="409" text-anchor="middle">5</text><text class="t" x="84" y="402" text-anchor="start">Прогрессия</text><text class="s" x="84" y="428" text-anchor="start">Сначала повторы, потом вес</text></svg>
